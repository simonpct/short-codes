<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IGN WMS MapLibre</title>
    <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
    <style>
        html, body, #map { height: 100%; margin: 0; }
        .maplibregl-canvas { cursor: pointer; }
        .info-popup .maplibregl-popup-content { max-height: 200px; overflow-y: auto; padding: 6px 22px 6px 8px; font: 12px/1.3 sans-serif; }
        .info-popup .feature span { color: #666; }
        .info-popup .feature + .feature { margin-top: 4px; padding-top: 4px; border-top: 1px solid #ddd; }
        .layer-panel { position: absolute; top: 10px; right: 10px; z-index: 1; padding: 6px 10px; background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font: 13px/1.6 sans-serif; }
        .layer-panel label { display: block; cursor: pointer; }
        .layer-panel small { display: block; color: #666; }
        .search-box { position: absolute; top: 10px; left: 10px; z-index: 1; width: 280px; font: 13px/1.4 sans-serif; }
        .search-box input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
        .search-results { margin: 4px 0 0; padding: 0; list-style: none; background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
        .search-results li { padding: 6px 8px; cursor: pointer; }
        .search-results li + li { border-top: 1px solid #eee; }
        .search-results li:hover { background: #f2f2f2; }
    </style>
</head>
<body>
<div id="map"></div>
<form id="search" class="search-box" autocomplete="off">
    <input type="search" name="q" placeholder="Rechercher une gare…">
    <ul id="search-results" class="search-results" hidden></ul>
</form>
<div id="layers" class="layer-panel">
    <label><input type="checkbox" data-layer="bdortho-layer" checked> Orthophotos</label>
    <label><input type="checkbox" data-layer="ign-layer" checked> Patrimoine (WMS)</label>
    <label><input type="checkbox" data-layer="prescriptions-surf-layer,prescriptions-surf-outline,prescriptions-layer" checked> Bâtis protégés (WFS)</label>
    <small id="zoom-hint" hidden>Zoomez à 13 ou plus pour les bâtis</small>
</div>

<script type="module">
    import * as maplibregl from './vendor/maplibre-gl/maplibre-gl.mjs';

    // data.geopf.fr limite le débit (429) : on réessaie après le délai Retry-After,
    // avec un léger décalage aléatoire pour ne pas renvoyer toutes les tuiles en même temps
    async function fetchGeopf(url, signal, onRetry) {
        for (let attempt = 0; ; attempt++) {
            const response = await fetch(url, { signal });
            if (response.status !== 429 || attempt >= 5) {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response;
            }
            onRetry?.();
            const wait = (parseFloat(response.headers.get('retry-after')) || 1) * 1000 + Math.random() * 1000;
            await new Promise((resolve, reject) => {
                const timer = setTimeout(resolve, wait);
                signal?.addEventListener('abort', () => { clearTimeout(timer); reject(signal.reason); }, { once: true });
            });
        }
    }

    // Les tuiles en geopf:// passent par fetchGeopf (abandon automatique si la tuile n'est plus utile)
    maplibregl.addProtocol('geopf', async (params, abortController) => {
        const response = await fetchGeopf(params.url.replace('geopf://', 'https://'), abortController.signal);
        return { data: await response.arrayBuffer() };
    });

    const params = new URLSearchParams(window.location.search);
    const zoom = parseFloat(params.get('z')) || 12;
    const lng = parseFloat(params.get('x')) || 2.35;
    const lat = parseFloat(params.get('y')) || 48.85;

    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'bdortho': {
                    type: 'raster',
                    tiles: ['geopf://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&FORMAT=image/jpeg&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}'],
                    tileSize: 256
                }
            },
            layers: [{ id: 'bdortho-layer', type: 'raster', source: 'bdortho' }]
        },
        center: [lng, lat],
        zoom: zoom
    });

    map.on('load', () => {
        map.addSource('ign-wms', {
            type: 'raster',
            // Tuiles de 512 px : 4 fois moins de requêtes GetMap qu'en 256 px
            tiles: ['geopf://data.geopf.fr/wms-v/ows?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=conservation_du_patrimoine&STYLES=default-style-conservation_du_patrimoine&FORMAT=image/png&TRANSPARENT=TRUE&CRS=EPSG:3857&WIDTH=512&HEIGHT=512&BBOX={bbox-epsg-3857}'],
            tileSize: 512
        });
        map.addLayer({ id: 'ign-layer', type: 'raster', source: 'ign-wms' });

        // Couches vecteur alimentées par le WFS (voir loadPrescriptions) : surfaces sous les ponctuelles
        map.addSource('prescriptions-surf', { type: 'geojson', data: EMPTY_FEATURES });
        map.addLayer({
            id: 'prescriptions-surf-layer',
            type: 'fill',
            source: 'prescriptions-surf',
            paint: {
                'fill-color': '#2e7d32',
                'fill-opacity': 0.3
            }
        });
        map.addLayer({
            id: 'prescriptions-surf-outline',
            type: 'line',
            source: 'prescriptions-surf',
            paint: {
                'line-color': '#2e7d32',
                'line-width': 1
            }
        });

        map.addSource('prescriptions', { type: 'geojson', data: EMPTY_FEATURES });
        map.addLayer({
            id: 'prescriptions-layer',
            type: 'circle',
            source: 'prescriptions',
            paint: {
                'circle-radius': 4,
                'circle-color': '#2e7d32',
                'circle-stroke-width': 1,
                'circle-stroke-color': '#ffffff'
            }
        });

        map.addSource('center-point', {
            type: 'geojson',
            data: {
                type: 'FeatureCollection',
                features: [{
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [lng, lat] // Utilise les variables de l'URL
                    }
                }]
            }
        });

        // 3. Dessin du point rouge sur la carte
        map.addLayer({
            id: 'center-point-layer',
            type: 'circle',
            source: 'center-point',
            paint: {
                'circle-radius': 8,          // Taille du point en pixels
                'circle-color': '#ff0000',    // Couleur rouge pure
                'circle-stroke-width': 2,     // Bordure blanche pour le contraste
                'circle-stroke-color': '#ffffff'
            }
        });

        map.on('moveend', loadPrescriptions);
        loadPrescriptions();

        // Survol d'une prescription : tooltip avec son libellé et son code typepsc-stypepsc
        const hoverPopup = new maplibregl.Popup({ className: 'info-popup', closeButton: false, closeOnClick: false, offset: 8 });
        for (const layer of ['prescriptions-layer', 'prescriptions-surf-layer']) {
            map.on('mousemove', layer, (e) => {
                const p = e.features[0].properties;
                const label = p.libelle || 'Prescription';
                hoverPopup.setLngLat(e.lngLat)
                    .setHTML(`<div class="feature"><b>${escapeHtml(label)}</b><br><span>Prescription ${escapeHtml(p.typepsc)}-${escapeHtml(p.stypepsc)}</span></div>`)
                    .addTo(map);
            });
            map.on('mouseleave', layer, () => hoverPopup.remove());
        }
    });

    // Prescriptions ponctuelles (WFS du Géoportail de l'urbanisme) : arbres protégés,
    // typepsc 07 avec sous-type 05 ou 06, chargées pour l'emprise visible
    const EMPTY_FEATURES = { type: 'FeatureCollection', features: [] };
    const PRESCRIPTIONS_MIN_ZOOM = 13; // en dessous, l'emprise est trop grande pour charger les données
    // Source GeoJSON -> couche WFS correspondante
    const PRESCRIPTIONS_TYPENAMES = {
        'prescriptions': 'wfs_du:prescription_pct',
        'prescriptions-surf': 'wfs_du:prescription_surf'
    };
    let prescriptionsController = null;

    async function loadPrescriptions() {
        prescriptionsController?.abort();
        const visible = map.getLayoutProperty('prescriptions-layer', 'visibility') !== 'none';
        const zoomOk = map.getZoom() >= PRESCRIPTIONS_MIN_ZOOM;
        document.getElementById('zoom-hint').hidden = !visible || zoomOk;
        if (!visible || !zoomOk) {
            for (const sourceId of Object.keys(PRESCRIPTIONS_TYPENAMES)) map.getSource(sourceId).setData(EMPTY_FEATURES);
            return;
        }

        const controller = new AbortController();
        prescriptionsController = controller;
        const b = map.getBounds();
        const bbox = `BBOX(the_geom,${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()},'EPSG:4326')`;
        await Promise.all(Object.entries(PRESCRIPTIONS_TYPENAMES).map(async ([sourceId, typename]) => {
            const query = new URLSearchParams({
                SERVICE: 'WFS',
                VERSION: '2.0.0',
                REQUEST: 'GetFeature',
                TYPENAMES: typename,
                OUTPUTFORMAT: 'application/json',
                COUNT: '5000',
                CQL_FILTER: `${bbox} AND typepsc IN ('07', '07-05','07-06')`
            });
            try {
                const response = await fetchGeopf(`https://data.geopf.fr/wfs/ows?${query}`, controller.signal);
                map.getSource(sourceId).setData(await response.json());
            } catch (err) {
                if (!controller.signal.aborted) console.warn(`${typename} indisponible`, err);
            }
        }));
    }

    // Panneau de couches : affiche ou masque les couches listées dans data-layer
    document.querySelectorAll('#layers input[data-layer]').forEach((input) => {
        input.addEventListener('change', () => {
            for (const layer of input.dataset.layer.split(',')) {
                map.setLayoutProperty(layer, 'visibility', input.checked ? 'visible' : 'none');
            }
            if (input.dataset.layer.includes('prescriptions-layer')) loadPrescriptions();
        });
    });

    const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Convertit la réponse HTML de GeoServer en contenu compact : nom + type de servitude
    function renderFeatureInfo(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const parts = [];
        doc.querySelectorAll('table.featureInfo').forEach((table) => {
            const headers = [...table.querySelectorAll('tr:first-child th')].map((th) => th.textContent.trim());
            [...table.querySelectorAll('tr')].slice(1).forEach((tr) => {
                const cells = [...tr.querySelectorAll('td')].map((td) => td.textContent.trim());
                const props = {};
                headers.forEach((h, i) => { props[h] = cells[i] || ''; });
                const name = props.nomsuplitt || props.nomass;
                if (!name) return;
                const details = [props.suptype && props.suptype.toUpperCase(), props.typeass].filter(Boolean).join(' · ');
                const link = /^https?:\/\//.test(props.urlreg) ? ` <a href="${escapeHtml(props.urlreg)}" target="_blank" rel="noopener">↗</a>` : '';
                parts.push(`<div class="feature"><b>${escapeHtml(name)}</b>${link}${details ? `<br><span>${escapeHtml(details)}</span>` : ''}</div>`);
            });
        });
        return [...new Set(parts)].join('');
    }

    // Au clic : GetFeatureInfo sur la couche WMS et affichage dans un tooltip
    map.on('click', async (e) => {
        const R = 6378137;
        const x = e.lngLat.lng * Math.PI / 180 * R;
        const y = Math.log(Math.tan(Math.PI / 4 + e.lngLat.lat * Math.PI / 360)) * R;
        const size = 11; // fenêtre de tolérance en pixels autour du clic
        const res = 2 * Math.PI * R / (512 * Math.pow(2, map.getZoom()));
        const half = res * size / 2;
        const url = 'https://data.geopf.fr/wms-v/ows?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetFeatureInfo'
            + '&LAYERS=conservation_du_patrimoine&QUERY_LAYERS=conservation_du_patrimoine&STYLES='
            + '&INFO_FORMAT=text/html&FEATURE_COUNT=10&CRS=EPSG:3857'
            + `&WIDTH=${size}&HEIGHT=${size}&I=${Math.floor(size / 2)}&J=${Math.floor(size / 2)}`
            + `&BBOX=${x - half},${y - half},${x + half},${y + half}`;

        const popup = new maplibregl.Popup({ className: 'info-popup', maxWidth: '260px' })
            .setLngLat(e.lngLat)
            .setHTML('Chargement…')
            .addTo(map);
        const controller = new AbortController();
        popup.on('close', () => controller.abort());
        try {
            const response = await fetchGeopf(url, controller.signal, () => popup.setHTML('Serveur saturé, nouvel essai…'));
            const content = renderFeatureInfo(await response.text());
            popup.setHTML(content || 'Aucune information à cet endroit.');
        } catch (err) {
            if (!controller.signal.aborted) popup.setHTML('Erreur lors de la récupération des informations.');
        }
    });

    // Gares voyageurs (SNCF Open Data) : liste chargée une fois, autocomplétion faite localement
    const GARES_URL = 'https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/gares-de-voyageurs/exports/json'
        + '?select=nom,libellecourt,segment_drg,position_geographique,codeinsee&limit=-1';
    const normalize = (str) => (str || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    let gares = [];
    let garesLoaded = false;
    fetch(GARES_URL)
        .then((response) => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.json();
        })
        .then((data) => {
            gares = data
                .filter((gare) => gare.position_geographique)
                .map((gare) => ({ ...gare, key: normalize(gare.nom) }));
            garesLoaded = true;
        })
        .catch((err) => console.warn('Liste des gares indisponible', err));

    const searchForm = document.getElementById('search');
    const searchResults = document.getElementById('search-results');
    let suggestions = [];

    function showSearchItems(items) {
        searchResults.replaceChildren(...items);
        searchResults.hidden = items.length === 0;
    }

    function selectGare(gare) {
        const { lon: placeLng, lat: placeLat } = gare.position_geographique;
        const placeZoom = 16;
        // Le point rouge et l'URL (x, y, z) suivent la gare choisie
        map.getSource('center-point').setData({
            type: 'FeatureCollection',
            features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [placeLng, placeLat] } }]
        });
        history.replaceState(null, '', `?z=${placeZoom}&x=${placeLng}&y=${placeLat}`);
        map.flyTo({ center: [placeLng, placeLat], zoom: placeZoom });
        searchForm.q.value = gare.nom;
        searchResults.hidden = true;
    }

    // Suggestions à la frappe : préfixe du nom en premier, puis sous-chaîne ou code court
    searchForm.q.addEventListener('input', () => {
        const q = normalize(searchForm.q.value.trim());
        if (!q) {
            suggestions = [];
            searchResults.hidden = true;
            return;
        }
        if (!garesLoaded) {
            showSearchItems([Object.assign(document.createElement('li'), { textContent: 'Chargement des gares…' })]);
            return;
        }
        suggestions = gares
            .filter((gare) => gare.key.includes(q) || normalize(gare.libellecourt).startsWith(q))
            .sort((a, b) => Number(!a.key.startsWith(q)) - Number(!b.key.startsWith(q)))
            .slice(0, 8);
        const items = suggestions.map((gare) => {
            const li = document.createElement('li');
            li.textContent = `${gare.nom} (${gare.libellecourt})`;
            li.addEventListener('click', () => selectGare(gare));
            return li;
        });
        if (!items.length) items.push(Object.assign(document.createElement('li'), { textContent: 'Aucune gare trouvée' }));
        showSearchItems(items);
    });

    // Entrée : sélectionne la première suggestion
    searchForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (suggestions.length) selectGare(suggestions[0]);
    });
</script>
</body>
</html>
