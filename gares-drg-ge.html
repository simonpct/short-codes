<!DOCTYPE html><html><head><meta charset="utf-8"><title>IGN WMS MapLibre</title><script src="https://unpkg.com@^5/dist/maplibre-gl.js"></script><link rel="stylesheet" href="https://unpkg.com@^5/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0;}</style></head><body><div id="map"></div><script>
const params = new URLSearchParams(window.location.search);
const zoom = parseFloat(params.get('z')) || 12;
const lng = parseFloat(params.get('x')) || 2.35;
const lat = parseFloat(params.get('y')) || 48.85;

const map = new maplibregl.Map({container:'map',style:{version:8,sources:{'osm':{type:'raster',tiles:['https://openstreetmap.org{z}/{x}/{y}.png'],tileSize:256}},layers:[{id:'osm-layer',type:'raster',source:'osm'}]},center:[lng,lat],zoom:zoom});

map.on('load',()=>{
    map.addSource('ign-wms',{
        type:'raster',
        tiles:['https://data.geopf.fr/wms-v/ows?gp-ol-ext=1.0.0-beta.15-597&REQUEST=GetMap&SERVICE=WMS&VERSION=1.3.0&FORMAT=image/png&STYLES=default-style-conservation_du_patrimoine&TRANSPARENT=TRUE&LAYERS=conservation_du_patrimoine&WIDTH=256&HEIGHT=256&CRS=EPSG:3857&BBOX={bbox-epsg-3857}'],
        tileSize:256
    });
    map.addLayer({id:'ign-layer',type:'raster',source:'ign-wms'});
});
</script></body></html>
