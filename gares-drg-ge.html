<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IGN WMS MapLibre</title>
    <!-- Le fichier CSS reste inchangé -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6/dist/maplibre-gl.css">
    <style>
        html, body, #map { height: 100%; margin: 0; }
    </style>
</head>
<body>
<div id="map"></div>

<!-- 1. Notez l'ajout de type="module" ici -->
<script type="module">
    // 2. Importation explicite de l'objet de cartographie moderne
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6/dist/maplibre-gl.mjs';

    const params = new URLSearchParams(window.location.search);
    const zoom = parseFloat(params.get('z')) || 12;
    const lng = parseFloat(params.get('x')) || 2.35;
    const lat = parseFloat(params.get('y')) || 48.85;

    const map = new maplibregl.Map({
        container: 'map',
        style: {
            version: 8,
            sources: {
                'osm': {
                    type: 'raster',
                    tiles: ['https://openstreetmap.org{z}/{x}/{y}.png'],
                    tileSize: 256
                }
            },
            layers: [{ id: 'osm-layer', type: 'raster', source: 'osm' }]
        },
        center: [lng, lat],
        zoom: zoom
    });

    map.on('load', () => {
        map.addSource('ign-wms', {
            type: 'raster',
            tiles: ['https://geopf.fr{bbox-epsg-3857}'],
            tileSize: 256
        });
        map.addLayer({ id: 'ign-layer', type: 'raster', source: 'ign-wms' });
    });
</script>
</body>
</html>
